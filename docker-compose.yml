services:
  typesense:
    image: typesense/typesense:27.1
    container_name: cartverse-typesense
    restart: unless-stopped
    ports:
      - "8108:8108"
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-cartverse_typesense_secret_key_2026}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_ENABLE_CORS: "true"
    volumes:
      - typesense-data:/data

  redis:
    image: redis:7-alpine
    container_name: cartverse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  search-service:
    build:
      context: ./search-service
      dockerfile: Dockerfile
    container_name: cartverse-search-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-cartverse_typesense_secret_key_2026}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://postgres:postgres@host.docker.internal:5432/cartverse
    depends_on:
      - typesense
      - redis

volumes:
  typesense-data:
  redis-data:
